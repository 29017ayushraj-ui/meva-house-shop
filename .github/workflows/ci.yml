name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meva_house
          POSTGRES_USER: meva
          POSTGRES_PASSWORD: meva_local_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meva -d meva_house"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://meva:meva_local_password@localhost:5432/meva_house?schema=public
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
